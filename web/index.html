<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qwen Orchestra</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">Qwen Orchestra</div>
        <button type="button" class="btn btn-primary" id="btn-new">New Chat</button>
      </div>
      <nav class="chat-list" id="chat-list" aria-label="Чаты"></nav>
      <div class="sidebar-bottom">
        <label class="field-label" for="tier-select">Tier</label>
        <select id="tier-select" class="tier-select">
          <option value="auto">Auto</option>
        </select>
        <div class="tier-actions">
          <button type="button" class="btn btn-ghost btn-block" id="btn-models">Модели и промпты</button>
        </div>
        <div class="health" id="health" title="Статус Ollama">Проверка…</div>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <h1 class="chat-title" id="chat-title">New Chat</h1>
        <div class="header-actions">
          <button type="button" class="btn btn-ghost" id="btn-clear" title="Очистить чат">Clear</button>
          <button type="button" class="btn btn-ghost danger" id="btn-delete" title="Удалить чат">Delete</button>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <footer class="composer-wrap">
        <div class="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="Спросите оркестр… (Enter — отправить, Shift+Enter — новая строка)"
            autocomplete="off"
          ></textarea>
          <button type="button" class="btn btn-send" id="btn-send" disabled>Send</button>
        </div>
        <div class="composer-hint" id="status-line">localhost · оркестр 0.8b → 4b → 9b → 14b · adaptive ctx</div>
      </footer>
    </main>
  </div>

  <div class="modal-backdrop" id="models-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="models-modal-title">
      <header class="modal-header">
        <h2 id="models-modal-title">Модели и промпты роутера</h2>
        <button type="button" class="btn btn-ghost" id="btn-models-close" title="Закрыть">✕</button>
      </header>
      <p class="modal-hint">
        Для каждой нейронки — когда Auto её выбирает. Builtin-слоты нельзя удалить;
        можно сменить модель Ollama и текст промпта. Новые слоты — кнопка ниже.
      </p>
      <div class="modal-body" id="models-list"></div>
      <div class="add-slot-form" id="add-slot-form">
        <div class="field-label">Добавить нейронку</div>
        <div class="add-slot-row">
          <select id="add-slot-model" class="tier-select" title="Модель из Ollama"></select>
          <input id="add-slot-id" class="text-input" type="text" placeholder="id (необяз.)" maxlength="32" />
          <input id="add-slot-rank" class="text-input rank-input" type="number" value="2" min="0" max="9" title="rank" />
        </div>
        <input id="add-slot-label" class="text-input" type="text" placeholder="Подпись в списке" />
        <textarea id="add-slot-prompt" class="prompt-input" rows="2" placeholder="Когда роутеру выбирать эту модель…"></textarea>
        <label class="check-label"><input type="checkbox" id="add-slot-auto" checked /> Участвует в Auto-роутере</label>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-ghost" id="btn-models-reset">Сбросить по умолчанию</button>
        <div class="modal-footer-right">
          <button type="button" class="btn btn-primary" id="btn-models-add">Добавить нейронку</button>
          <button type="button" class="btn btn-send" id="btn-models-save">Сохранить</button>
        </div>
      </footer>
      <div class="modal-status" id="models-status"></div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
